<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <main>
        <div class="model">
            <div class="model-content">
                <h2>Game Over</h2>
                <h3>Your Score: <span id="score-value">0</span></h3>
                <div>
                    <button id="start-again">Start Again</button>
                    <button id="main-menu">Main Menu</button>
                </div>
            </div>
        </div>
        <div class="top">
            <div class="nav-elem score">Score: <span id="scoreValue">0</span></div>
            <div class="nav-elem High-score:">High Score: <span id="highScoreValue">0</span></div>
            <div class="nav-elem timer">Timer: <span id="Timer">00-00</span></div>
            <button class="start-btn">Start Game</button>
        </div>
        <div class="bottom"></div>
    </main>
    <script src="script.js"></script>
</body>
</html>
